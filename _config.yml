# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Michael Aebli's Pages
description: >- # this means to ignore newlines until "baseurl:"
  Notes on embedded development, Rust, and the M-Bus protocol, by Michael Aebli.
baseurl: "" # the subpath of your site, e.g. /blog
url: https://maebli.github.io
lang: en
github_username:  maebli
linkedin_username: aebli
author: Michael Aebli

# Used by jekyll-seo-tag for the JSON-LD publisher logo. The default social
# preview image is set under `defaults` below, because jekyll-seo-tag reads the
# image from the page only — it has no site-level fallback.
logo: /assets/img/icon-192.png

# NOTE: deliberately no `twitter:` block. jekyll-seo-tag emits
# `twitter:site="@"` and a bogus `twitter:creator` from the author name
# whenever `site.twitter` exists but has no username.

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jemoji
  - jekyll-paginate
  - jekyll-redirect-from

# jekyll-feed only picks up _posts by default. This adds a second feed for the
# (completed) 100 Rust Challenge collection at /feed/archive.xml.
feed:
  # Default is 10; the challenge is a finished, static set, so serve all of it.
  posts_limit: 100
  collections:
    archive:
      path: "/feed/archive.xml"

social_links:
    linkedin: aebli
    
defaults:
  # Site-wide social preview image. Any post can override it with `image:`.
  - scope:
      path: ""
    values:
      image: /assets/img/og-default.png
  - scope:
      path: "assets/img"
    values:
      image: true
  - scope:
      path: "assets/js"
    values:
      js: true
  # Archive posts open with a code block, so the excerpt jekyll-seo-tag would
  # otherwise fall back to is raw Rust. Give the collection a sane description.
  - scope:
      type: "archive"
    values:
      description: >-
        Part of the 100 Rust Challenge — one small Rust problem at a time,
        with the solution worked through in full.

disqus:
  shortname: maebli-github-io

# Google Analytics
google_analytics: G-QP4ZSMHQP9

paginate: 10
paginate_path: "/page:num/"

collections:
  archive:
    output: true
    permalink: /archive/:name/

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
